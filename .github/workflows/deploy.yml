name: Deploy to GitHub Pages + Build Info

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build project
        run: npm run build
        env:
          # 这里的 URL 会在构建时被注入到前端代码中
          # 后端 Railway 部署地址
          VITE_API_BASE: ${{ vars.RAILWAY_BACKEND_URL || 'https://your-backend.railway.app' }}
        
      - name: Generate build info
        run: |
          echo "Build completed at $(date)"
          echo "API_BASE=${{ vars.RAILWAY_BACKEND_URL || 'not set' }}"
          echo "GitHub Pages URL: https://shenci529.github.io/health-management-system/"
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
