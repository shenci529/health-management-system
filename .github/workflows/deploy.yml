name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        # 注意：GitHub Pages 上运行时没有后端 API 服务
        # 如已将后端部署到 Render/Railway，请在仓库 Settings → Secrets and variables → Actions → Variables
        # 设置 BACKEND_API_URL 为你的后端地址（例如：https://health-management-system.onrender.com）
        run: npm run build
        env:
          VITE_API_BASE: ${{ vars.BACKEND_API_URL || '' }}

      - name: 打印构建信息
        run: |
          echo "✅ 构建完成"
          echo "API 基础地址: ${{ vars.BACKEND_API_URL || '(相对路径，未设置后端地址)' }}"
          ls -lah dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
